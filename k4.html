<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K4 — Phân trang danh sách</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --panel:#10161d; --panel-2:#141b23; --line:#212b35;
    --text:#e6edf3; --muted:#7c8a99; --accent:#5eead4; --accent-dim:rgba(94,234,212,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,234,212,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'IBM Plex Sans', sans-serif; min-height:100vh;
    padding:48px 24px 80px; line-height:1.6;
  }
  .wrap{max-width:720px; margin:0 auto;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:13px; margin-bottom:28px;}
  .back:hover{color:var(--accent);}
  .code{font-size:12px; color:var(--accent); background:var(--accent-dim); padding:3px 8px; border-radius:3px;}
  h1{font-size:clamp(26px,4vw,34px); font-weight:700; margin:14px 0 6px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:28px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .toolbar .count{font-size:12.5px; color:var(--muted);}
  .toolbar select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:12.5px; padding:7px 10px; border-radius:4px;
  }

  .list{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel);}
  .list-item{
    display:flex; align-items:center; gap:14px;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .avatar{
    flex:none; width:36px; height:36px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px;
    color:var(--bg);
  }
  .item-title{font-size:14px; font-weight:500;}
  .item-sub{font-size:12px; color:var(--muted);}

  .pagination{display:flex; justify-content:center; align-items:center; gap:6px; margin-top:22px; flex-wrap:wrap;}
  .page-btn{
    min-width:34px; height:34px; padding:0 8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    border-radius:6px; cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:13px;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .page-btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  .page-btn.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .page-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .page-dots{color:var(--muted); font-size:13px; padding:0 4px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back mono" href="bt36.html">← bt36.html</a>
  <div><span class="code mono">K4</span></div>
  <h1 class="display">Phân trang danh sách</h1>
  <p class="sub">Danh sách 42 mục được chia thành nhiều trang, mỗi trang hiển thị một số lượng cố định — click số trang hoặc đổi số mục/trang để xem lại.</p>

  <div class="toolbar">
    <div class="count mono" id="countLabel"></div>
    <select id="perPage">
      <option value="5">5 / trang</option>
      <option value="8" selected>8 / trang</option>
      <option value="12">12 / trang</option>
    </select>
  </div>

  <div class="list" id="list"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
  const TOTAL = 42;
  const colors = ['#5eead4','#f5a623','#7c93ff','#ff6b81','#a3e635','#c084fc'];

  const items = Array.from({length: TOTAL}, (_, i) => ({
    id: i + 1,
    name: `Thành viên #${i + 1}`,
    role: ['Sinh viên', 'Giảng viên', 'Trợ giảng', 'Quản trị'][i % 4]
  }));

  let currentPage = 1;
  let perPage = 8;

  const listEl = document.getElementById('list');
  const paginationEl = document.getElementById('pagination');
  const countLabel = document.getElementById('countLabel');
  const perPageSelect = document.getElementById('perPage');

  function render(){
    const totalPages = Math.ceil(items.length / perPage);
    if(currentPage > totalPages) currentPage = totalPages;
    if(currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * perPage;
    const pageItems = items.slice(start, start + perPage);

    countLabel.textContent = `Hiển thị ${start + 1}–${start + pageItems.length} / ${items.length} mục`;

    listEl.innerHTML = pageItems.map(it => `
      <div class="list-item">
        <div class="avatar" style="background:${colors[it.id % colors.length]}">${it.name.slice(-2)}</div>
        <div>
          <div class="item-title">${it.name}</div>
          <div class="item-sub">${it.role}</div>
        </div>
      </div>
    `).join('');

    renderPagination(totalPages);
  }

  function renderPagination(totalPages){
    let html = `<button class="page-btn" id="prevBtn" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

    const pages = [];
    for(let p = 1; p <= totalPages; p++){
      if(p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) pages.push(p);
    }

    let last = 0;
    pages.forEach(p => {
      if(last && p - last > 1) html += `<span class="page-dots">…</span>`;
      html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`;
      last = p;
    });

    html += `<button class="page-btn" id="nextBtn" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
    paginationEl.innerHTML = html;

    paginationEl.querySelectorAll('[data-page]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPage = Number(btn.dataset.page);
        render();
      });
    });
    document.getElementById('prevBtn').addEventListener('click', () => { currentPage--; render(); });
    document.getElementById('nextBtn').addEventListener('click', () => { currentPage++; render(); });
  }

  perPageSelect.addEventListener('change', () => {
    perPage = Number(perPageSelect.value);
    currentPage = 1;
    render();
  });

  render();
</script>
</body>
</html>
