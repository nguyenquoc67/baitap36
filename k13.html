<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K13 — Bộ đếm tương tác (Like)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --panel:#10161d; --panel-2:#141b23; --line:#212b35;
    --text:#e6edf3; --muted:#7c8a99; --accent:#5eead4; --accent-dim:rgba(94,234,212,0.12);
    --heart:#ff6b81;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,234,212,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'IBM Plex Sans', sans-serif; min-height:100vh;
    padding:48px 24px 80px; line-height:1.6;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:13px; margin-bottom:28px;}
  .back:hover{color:var(--accent);}
  .code{font-size:12px; color:var(--accent); background:var(--accent-dim); padding:3px 8px; border-radius:3px; letter-spacing:0.04em;}
  h1{font-size:clamp(26px,4vw,34px); font-weight:700; margin:14px 0 6px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:36px;}

  .term{background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
  .term-bar{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--panel-2); border-bottom:1px solid var(--line);}
  .dot{width:10px; height:10px; border-radius:50%;}
  .dot.r{background:#ff5f56;} .dot.y{background:#ffbd2e;} .dot.g{background:#27c93f;}
  .term-title{margin-left:8px; font-size:12px; color:var(--muted);}
  .term-body{padding:48px 32px; display:flex; flex-direction:column; align-items:center; gap:20px;}

  .like-btn{
    position:relative;
    width:88px; height:88px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel-2);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, border-color .18s ease, background .18s ease;
  }
  .like-btn svg{width:36px; height:36px; transition:transform .25s cubic-bezier(.34,1.56,.64,1), fill .18s ease;}
  .like-btn:hover{border-color:var(--heart); transform:translateY(-2px);}
  .like-btn:active{transform:scale(0.92);}
  .like-btn.liked svg{fill:var(--heart); stroke:var(--heart); transform:scale(1.12);}
  .like-btn:focus-visible{outline:2px solid var(--accent); outline-offset:4px;}

  .count{font-family:'Space Grotesk', sans-serif; font-size:40px; font-weight:700;}
  .count-label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em;}
  .hint{font-size:12.5px; color:#4b5764; margin-top:8px;}
  .reset{
    margin-top:12px; background:none; border:1px solid var(--line); color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:8px 16px; border-radius:4px; cursor:pointer;
    transition:border-color .18s ease, color .18s ease;
  }
  .reset:hover{border-color:var(--accent); color:var(--accent);}

  .code-block{margin-top:28px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:16px 18px; font-size:12.5px; color:var(--muted); overflow-x:auto;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back mono" href="bt36.html">← bt36.html</a>
  <div><span class="code mono">K13</span></div>
  <h1 class="display">Bộ đếm tương tác (Like)</h1>
  <p class="sub">Nhấn nút để tăng/giảm số lượt thích, trạng thái được cập nhật trực tiếp trên DOM.</p>

  <div class="term">
    <div class="term-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="term-title mono">k13.html — like-counter</span>
    </div>
    <div class="term-body">
      <button class="like-btn" id="likeBtn" aria-pressed="false" aria-label="Thích">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/>
        </svg>
      </button>
      <div>
        <div class="count mono" id="countVal">0</div>
        <div class="count-label">lượt thích</div>
      </div>
      <div class="hint mono">Click để like / bỏ like</div>
      <button class="reset" id="resetBtn">reset()</button>
    </div>
  </div>

  <div class="code-block mono">// logic chính: mỗi lần click toggle trạng thái liked
// và cộng/trừ biến đếm, đồng bộ lại giao diện</div>
</div>

<script>
  const likeBtn = document.getElementById('likeBtn');
  const countVal = document.getElementById('countVal');
  const resetBtn = document.getElementById('resetBtn');

  let count = 0;
  let liked = false;

  function render(){
    countVal.textContent = count;
    likeBtn.classList.toggle('liked', liked);
    likeBtn.setAttribute('aria-pressed', liked);
  }

  likeBtn.addEventListener('click', () => {
    liked = !liked;
    count += liked ? 1 : -1;
    if(count < 0) count = 0;
    render();
  });

  resetBtn.addEventListener('click', () => {
    count = 0;
    liked = false;
    render();
  });

  render();
</script>
</body>
</html>
