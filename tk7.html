<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK7 — Tạo chuỗi ngẫu nhiên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --panel:#10161d; --panel-2:#141b23; --line:#212b35;
    --text:#e6edf3; --muted:#7c8a99; --accent:#5eead4; --accent-dim:rgba(94,234,212,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,234,212,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'IBM Plex Sans', sans-serif; min-height:100vh;
    padding:48px 24px 80px; line-height:1.6;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:13px; margin-bottom:28px;}
  .back:hover{color:var(--accent);}
  .code{font-size:12px; color:var(--accent); background:var(--accent-dim); padding:3px 8px; border-radius:3px;}
  h1{font-size:clamp(26px,4vw,34px); font-weight:700; margin:14px 0 6px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:32px;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:28px;}

  .output{
    background:var(--panel-2); border:1px solid var(--line); border-radius:4px;
    padding:20px; font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:1px;
    color:var(--accent); word-break:break-all; min-height:60px; display:flex; align-items:center;
  }

  .options{display:flex; flex-wrap:wrap; gap:18px; margin-top:20px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em;}
  .field input[type=number]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-family:'JetBrains Mono', monospace; padding:8px 10px; border-radius:4px; width:80px;
  }
  .toggle{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
  .toggle input{accent-color:var(--accent);}

  .actions{display:flex; gap:10px; margin-top:22px;}
  .btn{
    background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent);
    font-family:'JetBrains Mono', monospace; font-size:12.5px; padding:10px 18px; border-radius:4px;
    cursor:pointer; transition:background .18s ease;
  }
  .btn:hover{background:rgba(94,234,212,0.22);}
  .btn.ghost{background:none; color:var(--muted); border-color:var(--line);}
  .btn.ghost:hover{color:var(--text); border-color:var(--muted);}
  .copied{font-size:12px; color:var(--accent); margin-left:8px; opacity:0; transition:opacity .2s ease;}
  .copied.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back mono" href="bt36.html">← bt36.html</a>
  <div><span class="code mono">TK7</span></div>
  <h1 class="display">Tạo chuỗi ngẫu nhiên</h1>
  <p class="sub">Sinh chuỗi ký tự ngẫu nhiên với độ dài và bộ ký tự tùy chọn, dùng <code class="mono">Math.random()</code>.</p>

  <div class="panel">
    <div class="output mono" id="output">........................</div>

    <div class="options">
      <div class="field">
        <label>Độ dài</label>
        <input type="number" id="length" min="1" max="64" value="16">
      </div>
      <div class="toggle mono"><input type="checkbox" id="useUpper" checked> A-Z</div>
      <div class="toggle mono"><input type="checkbox" id="useLower" checked> a-z</div>
      <div class="toggle mono"><input type="checkbox" id="useNumbers" checked> 0-9</div>
      <div class="toggle mono"><input type="checkbox" id="useSymbols"> !@#$</div>
    </div>

    <div class="actions">
      <button class="btn" id="genBtn">generate()</button>
      <button class="btn ghost" id="copyBtn">copy</button>
      <span class="copied mono" id="copiedMsg">đã copy ✓</span>
    </div>
  </div>
</div>

<script>
  const output = document.getElementById('output');
  const lengthInput = document.getElementById('length');
  const useUpper = document.getElementById('useUpper');
  const useLower = document.getElementById('useLower');
  const useNumbers = document.getElementById('useNumbers');
  const useSymbols = document.getElementById('useSymbols');
  const genBtn = document.getElementById('genBtn');
  const copyBtn = document.getElementById('copyBtn');
  const copiedMsg = document.getElementById('copiedMsg');

  const SETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*'
  };

  function generate(){
    let pool = '';
    if(useUpper.checked) pool += SETS.upper;
    if(useLower.checked) pool += SETS.lower;
    if(useNumbers.checked) pool += SETS.numbers;
    if(useSymbols.checked) pool += SETS.symbols;

    if(!pool){
      output.textContent = 'Chọn ít nhất một bộ ký tự';
      return;
    }

    let len = Math.min(64, Math.max(1, Number(lengthInput.value) || 16));
    let result = '';
    for(let i = 0; i < len; i++){
      result += pool[Math.floor(Math.random() * pool.length)];
    }
    output.textContent = result;
  }

  genBtn.addEventListener('click', generate);
  [useUpper, useLower, useNumbers, useSymbols].forEach(el => el.addEventListener('change', generate));
  lengthInput.addEventListener('input', generate);

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(output.textContent).then(() => {
      copiedMsg.classList.add('show');
      setTimeout(() => copiedMsg.classList.remove('show'), 1200);
    });
  });

  generate();
</script>
</body>
</html>
