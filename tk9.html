<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK9 — Thời gian thực</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --panel:#10161d; --panel-2:#141b23; --line:#212b35;
    --text:#e6edf3; --muted:#7c8a99; --accent:#5eead4; --accent-dim:rgba(94,234,212,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,234,212,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'IBM Plex Sans', sans-serif; min-height:100vh;
    padding:48px 24px 80px; line-height:1.6;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:13px; margin-bottom:28px;}
  .back:hover{color:var(--accent);}
  .code{font-size:12px; color:var(--accent); background:var(--accent-dim); padding:3px 8px; border-radius:3px;}
  h1{font-size:clamp(26px,4vw,34px); font-weight:700; margin:14px 0 6px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:32px;}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:48px 32px; text-align:center;
  }

  .clock{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(44px,9vw,72px);
    font-weight:600;
    letter-spacing:2px;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .clock .sep{animation:blink 1s steps(1) infinite;}
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0.15;}}

  .date{margin-top:10px; color:var(--muted); font-size:15px;}

  .zones{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:4px; overflow:hidden;
    margin-top:32px;
  }
  .zone{background:var(--panel-2); padding:14px 16px;}
  .zone .zname{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:5px;}
  .zone .ztime{font-family:'JetBrains Mono', monospace; font-size:15px;}

  @media (prefers-reduced-motion: reduce){
    .clock .sep{animation:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back mono" href="bt36.html">← bt36.html</a>
  <div><span class="code mono">TK9</span></div>
  <h1 class="display">Hiển thị thời gian thực</h1>
  <p class="sub">Đồng hồ cập nhật mỗi giây bằng <code class="mono">setInterval()</code> kết hợp đối tượng <code class="mono">Date</code>.</p>

  <div class="panel">
    <div class="clock mono" id="clock">--<span class="sep">:</span>--<span class="sep">:</span>--</div>
    <div class="date mono" id="dateStr">—</div>

    <div class="zones" id="zones"></div>
  </div>
</div>

<script>
  const clock = document.getElementById('clock');
  const dateStr = document.getElementById('dateStr');
  const zonesWrap = document.getElementById('zones');

  const weekdays = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

  const zones = [
    { name: 'TP.HCM', tz: 'Asia/Ho_Chi_Minh' },
    { name: 'Tokyo', tz: 'Asia/Tokyo' },
    { name: 'London', tz: 'Europe/London' },
    { name: 'New York', tz: 'America/New_York' }
  ];

  function pad(n){ return String(n).padStart(2, '0'); }

  function renderMain(){
    const now = new Date();
    clock.innerHTML = `${pad(now.getHours())}<span class="sep">:</span>${pad(now.getMinutes())}<span class="sep">:</span>${pad(now.getSeconds())}`;
    dateStr.textContent = `${weekdays[now.getDay()]}, ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  }

  function renderZones(){
    zonesWrap.innerHTML = '';
    zones.forEach(z => {
      const time = new Date().toLocaleTimeString('vi-VN', { timeZone: z.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const cell = document.createElement('div');
      cell.className = 'zone';
      cell.innerHTML = `<div class="zname">${z.name}</div><div class="ztime mono">${time}</div>`;
      zonesWrap.appendChild(cell);
    });
  }

  function tick(){
    renderMain();
    renderZones();
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
